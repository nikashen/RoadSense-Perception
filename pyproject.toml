[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense-perception"
version = "0.1.0.dev0"
description = "Evidence-first 2D perception laboratory for detection, segmentation, and tracking"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "nika"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/nikashen/RoadSense-Perception"
Repository = "https://github.com/nikashen/RoadSense-Perception"
Issues = "https://github.com/nikashen/RoadSense-Perception/issues"

[project.optional-dependencies]
serve = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
vision = [
  "pillow>=10,<13",
  "onnxruntime>=1.18,<2",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<0.29",
  "httpx2>=2,<3",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
roadsense = "roadsense.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roadsense = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
files = ["src/roadsense/contracts.py", "src/roadsense/geometry.py", "src/roadsense/metrics", "src/roadsense/tracking"]
