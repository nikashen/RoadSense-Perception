name: RoadSense Pages

on:
  workflow_run:
    workflows: ["RoadSense CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadsense-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROADSENSE_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      # configure-pages reads the repository's Pages configuration before
      # upload-pages-artifact creates the deployment bundle.
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/build_pages.py --output dist/pages
      - run: python scripts/verify_pages.py dist/pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
